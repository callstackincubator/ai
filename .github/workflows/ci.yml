name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: bun run lint

      - name: Typecheck files
        run: bun run typecheck

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: cd packages/mlc && bun run prepare
    
  build-apple-llm:
    strategy:
      fail-fast: false
      matrix:
        # Xcode 26 (Swift 6.3) and Xcode 27 (Swift 6.4) compile different iOS 27 code paths
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: cd packages/apple-llm && bun run prepare

      - name: Typecheck Swift
        run: cd packages/apple-llm && bun run typecheck:swift
